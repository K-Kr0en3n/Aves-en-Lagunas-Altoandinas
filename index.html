<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avistamiento de aves en Espinar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="presentation" id="presentationScreen">
      <div class="overlay"></div>
      <div class="presentation-content">
        <p class="eyebrow">Espinar, Cusco</p>
        <h1>Espinar no solo es minería</h1>
        <p class="phrase">
          Aquí también vuelan historias
        </p>
      </div>
    </div>

    <main class="gallery" id="gallery">
      <header class="gallery-header">
        <p class="kicker">Avistamiento de aves en las lagunas andinas</p>
        <h2>Espinar en vuelto</h2>
      </header>

      <section class="balloons" aria-label="Lagunas y avistamientos de Espinar">
        <article class="balloon balloon-1">
          <div class="balloon-image-wrap">
            <img src="img/Apanta_parado.jpg" alt="Aves en la laguna de Apanta" />
          </div>
          <div class="balloon-label">
            <span>Laguna de Apanta</span>
          </div>
        </article>

        <article class="balloon balloon-2">
          <div class="balloon-image-wrap">
            <img src="img/Huayalla_Apacheta_parado.jpg" alt="Aves en Huayalla Apacheta" />
          </div>
          <div class="balloon-label">
            <span>Laguna de Huaylla Apacheta</span>
          </div>
        </article>

        <article class="balloon balloon-3">
          <div class="balloon-image-wrap">
            <img src="img/Qochapata_parado.jpg" alt="Aves en Qochapata" />
          </div>
          <div class="balloon-label">
            <span>Laguna de Qochapata</span>
          </div>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
